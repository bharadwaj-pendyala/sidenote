name: Release

# Publishing a GitHub release (tag v0.1.0, v0.2.0, ...) publishes both npm
# packages at the version in their package.json. Needs an NPM_TOKEN secret
# (an npm automation token) in the repository settings.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in package.json packages/remark-plugin/package.json; do
            v=$(node -p "require('./$pkg').version")
            if [ "$v" != "$tag" ]; then echo "$pkg is $v, tag is $tag"; exit 1; fi
          done
      - run: npm ci --prefix packages/remark-plugin
      - run: npm test
      - name: Publish remark-sidenote
        run: npm publish --provenance --access public
        working-directory: packages/remark-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sidenote-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
