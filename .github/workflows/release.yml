name: Release

# Publishes both npm packages at the version in their package.json. Needs an
# NPM_TOKEN secret (an npm automation token) in the repository settings.
#
# Two ways to release:
# - push a version tag (v0.1.0, v0.2.0, ...), or
# - Actions > Release > Run workflow on main: it publishes, then creates the
#   v<version> tag itself. Safe to re-run; published versions are skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the version tag on a manual run
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check the versions (and the tag, when run from one)
        run: |
          cli=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./packages/remark-plugin/package.json').version")
          if [ "$cli" != "$plugin" ]; then echo "sidenote-cli is $cli, remark-sidenote is $plugin"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$cli" ]; then echo "packages are $cli, tag is $GITHUB_REF_NAME"; exit 1; fi
          elif [ "$GITHUB_REF_NAME" != main ]; then
            echo "run this from main or from a version tag, not $GITHUB_REF_NAME"; exit 1
          fi
      - run: npm ci --prefix packages/remark-plugin
      - run: npm test
      # Each package is skipped when its version is already on npm, so a re-run
      # after a partial release finishes the other one instead of failing.
      - name: Publish remark-sidenote
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "remark-sidenote@$v" version >/dev/null 2>&1; then echo "remark-sidenote@$v is already published"; exit 0; fi
          npm publish --provenance --access public
        working-directory: packages/remark-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sidenote-cli
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "sidenote-cli@$v" version >/dev/null 2>&1; then echo "sidenote-cli@$v is already published"; exit 0; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release (manual runs on main)
        if: github.ref_type == 'branch'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag already exists"; exit 0; fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
